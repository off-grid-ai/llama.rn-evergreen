name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: npm run lint

      - name: Typecheck files
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run ts unit tests
        run: npm test -- --maxWorkers=2 --coverage

      - name: Run c++ unit tests
        run: |
          cd tests
          chmod +x build_and_test.sh run_tests.sh
          ./build_and_test.sh
          ./run_tests.sh

  build-ios-frameworks:
    runs-on: macos-26
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,modules,clang_index_store,system_headers
      OGA_READ_TOKEN: ${{ secrets.OGA_READ_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache ccache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-ios-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-ios-

      - name: Setup ccache
        run: |
          command -v ccache > /dev/null || brew install ccache
          ccache --zero-stats

      - name: Build frameworks
        run: |
          npm run build:ios-frameworks
          ccache --show-stats

      - name: Build Off Grid AI Mobile for the iOS simulator
        if: env.OGA_READ_TOKEN != ''
        uses: ./.github/actions/build-ogam
        with:
          platform: ios
          read-token: ${{ secrets.OGA_READ_TOKEN }}

  build-android-libs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OGA_READ_TOKEN: ${{ secrets.OGA_READ_TOKEN }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        run: |
          df -h
          echo "Removing dotnet"
          sudo rm -rf /usr/share/dotnet
          echo "Removing ghc"
          sudo rm -rf /opt/ghc
          echo "Removing hostedtoolcache"
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # Newer runner JDKs print a restricted-method warning that AGP's prefab
      # step reports as an error; React Native builds on JDK 17.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle cache
        uses: burrunan/gradle-cache-action@v3
        with:
          gradle-version: wrapper

      - name: Cache ccache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-android-libs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-android-libs-

      - name: Setup ccache
        uses: ./.github/actions/setup-ccache

      - name: Build libraries
        run: |
          npm run build:android-libs
          ccache --show-stats

      - name: Build Off Grid AI Mobile for Android
        if: env.OGA_READ_TOKEN != ''
        uses: ./.github/actions/build-ogam
        with:
          platform: android
          read-token: ${{ secrets.OGA_READ_TOKEN }}
